name: Diagnose lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics > flake8-diagnostics.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: flake8-diagnostics
          path: flake8-diagnostics.txt
          retention-days: 1
